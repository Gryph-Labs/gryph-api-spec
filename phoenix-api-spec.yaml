openapi: 3.1.0
info:
  title: Phoenix API
  description: >-
    Controlled HTTPS API for Gryph Labs systems. The API is designed for use by
    custom GPTs through GPT Actions and by other AI models and clients.
  version: 1.0.0
servers:
  - url: https://api.gryphlabs.com
    description: Phoenix API
tags:
  - name: System
    description: API health and status operations.
paths:
  /api/status:
    get:
      tags:
        - System
      summary: Get API status
      description: Returns the current availability of the Phoenix API.
      operationId: getApiStatus
      responses:
        '200':
          description: API is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    StatusResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          description: Current API status.
          examples:
            - ok
        version:
          type: string
          description: Deployed API version, when available.
          examples:
            - 1.0.0
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - message
        - errors
        - timestamp
      properties:
        status:
          type: integer
          format: int32
          description: HTTP status code returned for the error.
          examples:
            - 400
        message:
          type: string
          description: Human-readable summary of the error.
          examples:
            - Validation failed.
        errors:
          type: array
          description: Detailed error messages associated with the failure.
          items:
            type: string
          examples:
            -
              - Password must be at least 12 characters.
              - Password must contain at least 1 uppercase character.
        timestamp:
          type: string
          format: date-time
          description: Time the error response was created.
          examples:
            - '2026-09-09T19:28:00Z'
  responses:
    InternalServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
