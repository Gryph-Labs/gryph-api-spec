StatusResponse:
  type: object
  additionalProperties: false
  required:
    - status
  properties:
    status:
      type: string
      description: Current API status.
      examples:
        - ok
    version:
      type: string
      description: Deployed API version, when available.
      examples:
        - 1.0.0

ErrorResponse:
  type: object
  additionalProperties: false
  required:
    - message
  properties:
    message:
      type: string
      description: Human-readable error message.
