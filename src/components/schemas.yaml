StatusResponse:
  type: object
  additionalProperties: false
  required:
    - status
  properties:
    status:
      type: string
      description: Current API status.
      examples:
        - ok
    version:
      type: string
      description: Deployed API version, when available.
      examples:
        - 1.0.0

ErrorResponse:
  $ref: ../../common-spec/src/components/schemas.yaml#/ErrorResponse
